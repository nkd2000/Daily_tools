<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn & Practice | GenTools</title>
    <meta name="description" content="Interactive learning, reasoning, mathematics, and typing practice tools from GenTools.">
    <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { color-scheme: light; }
        body { font-family: 'DM Sans', sans-serif; background: #f7f8fc; }
        h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; }
        .hero-grid { background-image: linear-gradient(rgba(99,102,241,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(99,102,241,.07) 1px, transparent 1px); background-size: 28px 28px; }
        .tool-card { animation: rise .45s ease both; }
        @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen text-slate-800">
    <nav class="sticky top-0 z-50 border-b border-slate-200/80 bg-white/85 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="h-16 flex items-center justify-between gap-6">
                <a href="../../index.html" class="flex items-center gap-3 group">
                    <span class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-600 to-cyan-500 p-2 shadow-lg shadow-indigo-200 group-hover:rotate-3 transition-transform">
                        <img src="../../assets/img/favicon.svg" class="w-full h-full object-contain" alt="GenTools logo">
                    </span>
                    <span class="font-bold text-xl tracking-tight">GenTools<span class="text-indigo-600">.</span></span>
                </a>
                <div class="flex items-center gap-5 text-sm font-semibold text-slate-500">
                    <a href="../../index.html" class="hover:text-indigo-600 transition-colors">All Tools</a>
                    <a href="../../pages/contact.html" class="hidden sm:block hover:text-indigo-600 transition-colors">Contact</a>
                    <a href="https://github.com/nkd2000" target="_blank" rel="noreferrer" class="w-9 h-9 rounded-xl border border-slate-200 flex items-center justify-center hover:bg-slate-900 hover:text-white transition-colors" title="GitHub">
                        <i class="fa-brands fa-github"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <header class="hero-grid border-b border-slate-200 bg-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-14 sm:py-20">
            <div class="max-w-3xl">
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-50 border border-indigo-100 text-indigo-700 text-xs font-bold uppercase tracking-widest">
                    <i class="fa-solid fa-sparkles"></i> Practice Lab
                </div>
                <h1 class="mt-5 text-4xl sm:text-6xl font-bold tracking-tight text-slate-950">Learn by doing.</h1>
                <p class="mt-4 max-w-2xl text-lg text-slate-500 leading-relaxed">Build speed, sharpen reasoning, and explore ideas through focused interactive tools.</p>
            </div>
            <div class="mt-9 max-w-2xl relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input id="searchInput" type="search" placeholder="Search practice tools..." class="w-full rounded-2xl border border-slate-200 bg-white px-11 py-4 text-base shadow-sm outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100">
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
            <div>
                <p class="text-xs font-bold uppercase tracking-widest text-indigo-600">Your practice shelf</p>
                <h2 class="mt-1 text-2xl font-bold text-slate-900">Choose a challenge</h2>
            </div>
            <div id="filterBar" class="flex flex-wrap gap-2" aria-label="Tool categories"></div>
        </div>
        <div id="toolsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
        <div id="emptyState" class="hidden text-center py-20">
            <i class="fa-regular fa-face-frown-open text-4xl text-slate-300"></i>
            <p class="mt-4 font-semibold text-slate-600">No practice tools match that search.</p>
        </div>
    </main>

    <footer class="border-t border-slate-200 bg-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col sm:flex-row items-center justify-between gap-3 text-sm text-slate-500">
            <span>GenTools <span class="text-slate-400">·</span> Learn & Practice</span>
            <a href="../../index.html" class="font-semibold text-indigo-600 hover:text-indigo-800">Browse all tools <i class="fa-solid fa-arrow-right ml-1"></i></a>
        </div>
    </footer>

    <script src="../../tools-data.js"></script>
    <script>
        (() => {
            const learningTools = typeof TOOLS_DATABASE === 'undefined' ? [] : TOOLS_DATABASE.filter(tool => tool.cat === 'Learn');
            const grid = document.getElementById('toolsGrid');
            const filterBar = document.getElementById('filterBar');
            const searchInput = document.getElementById('searchInput');
            const emptyState = document.getElementById('emptyState');
            let activeFilter = 'all';

            const iconStyles = {
                orange: ['bg-orange-50', 'text-orange-600'],
                emerald: ['bg-emerald-50', 'text-emerald-600'],
                indigo: ['bg-indigo-50', 'text-indigo-600'],
                purple: ['bg-purple-50', 'text-purple-600']
            };

            function renderFilters() {
                const filters = ['all', ...new Set(learningTools.map(tool => tool.topic || 'Practice'))];
                filterBar.innerHTML = filters.map(filter => `<button type="button" data-filter="${filter}" class="filter-btn rounded-xl border px-3 py-2 text-xs font-bold transition ${activeFilter === filter ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-200 bg-white text-slate-600 hover:border-indigo-300'}">${filter === 'all' ? 'All' : filter}</button>`).join('');
                filterBar.querySelectorAll('.filter-btn').forEach(button => button.addEventListener('click', () => { activeFilter = button.dataset.filter; renderFilters(); renderTools(); }));
            }

            function renderTools() {
                const query = searchInput.value.trim().toLowerCase();
                const visibleTools = learningTools.filter(tool => {
                    const matchesFilter = activeFilter === 'all' || (tool.topic || 'Practice') === activeFilter;
                    const matchesQuery = `${tool.title} ${tool.desc}`.toLowerCase().includes(query);
                    return matchesFilter && matchesQuery;
                });
                grid.innerHTML = visibleTools.map((tool, index) => {
                    const [bg, text] = iconStyles[tool.color] || iconStyles.indigo;
                    const url = `../../${tool.url}`;
                    return `<a href="${url}" class="tool-card group relative overflow-hidden rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition duration-300 hover:-translate-y-1 hover:border-indigo-200 hover:shadow-xl hover:shadow-indigo-100" style="animation-delay:${index * 60}ms"><div class="absolute -right-8 -top-8 h-24 w-24 rounded-full bg-indigo-50 opacity-0 transition group-hover:scale-150 group-hover:opacity-100"></div><div class="relative"><div class="flex items-center justify-between"><span class="flex h-12 w-12 items-center justify-center rounded-xl ${bg} ${text}"><i class="fa-solid ${tool.icon.replace('fa-', '')} text-xl"></i></span><i class="fa-solid fa-arrow-up-right-from-square text-slate-300 transition group-hover:text-indigo-500"></i></div><h3 class="mt-6 text-xl font-bold text-slate-900 group-hover:text-indigo-600">${tool.title}</h3><p class="mt-2 text-sm leading-relaxed text-slate-500">${tool.desc}</p><span class="mt-6 inline-flex items-center gap-2 text-sm font-bold ${text}">Open challenge <i class="fa-solid fa-arrow-right text-xs transition group-hover:translate-x-1"></i></span></div></a>`;
                }).join('');
                emptyState.classList.toggle('hidden', visibleTools.length > 0);
            }

            searchInput.addEventListener('input', renderTools);
            renderFilters();
            renderTools();
        })();
    </script>
</body>
</html>
